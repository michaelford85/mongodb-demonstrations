# Local-only Iceberg stack for the Atlas → Iceberg reference-pattern demo.
# No cloud services: MinIO (S3), an Apache Iceberg REST catalog, and Trino.
# Versions are pinned to what this demo was tested against (see README).
name: atlas-iceberg-demo

services:
  # ── Local S3-compatible object storage ──────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: aid-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
      MINIO_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s

  # ── One-shot: create the Iceberg warehouse bucket, then exit ─────────────────
  minio-init:
    image: minio/mc:RELEASE.2024-11-05T11-29-45Z
    container_name: aid-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb --ignore-existing local/${S3_BUCKET:-warehouse} &&
      echo 'Bucket ${S3_BUCKET:-warehouse} ready';
      "

  # ── Apache Iceberg REST catalog (metadata pointer store) ─────────────────────
  iceberg-rest:
    image: apache/iceberg-rest-fixture:1.9.2
    container_name: aid-iceberg-rest
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_WAREHOUSE: s3://${S3_BUCKET:-warehouse}/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      CATALOG_S3_ACCESS__KEY__ID: ${S3_ACCESS_KEY:-minioadmin}
      CATALOG_S3_SECRET__ACCESS__KEY: ${S3_SECRET_KEY:-minioadmin}
      AWS_REGION: ${S3_REGION:-us-east-1}
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8181/v1/config?warehouse=s3://warehouse/ || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  # ── Trino: local SQL query engine over the Iceberg table ─────────────────────
  trino:
    image: trinodb/trino:468
    container_name: aid-trino
    depends_on:
      iceberg-rest:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./trino/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/v1/info | grep -q '\"starting\":false' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  minio-data:
    name: aid-minio-data
