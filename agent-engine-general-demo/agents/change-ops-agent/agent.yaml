# Human-readable app slug used by Agent Engine tooling.
# `agentengine create` should rewrite this when generating a new app from the template.
name: change-ops-agent
# Python import path to the SDK App instance.
# Format: <module path>:<variable name>. This app exposes `app` from
# src/agent_change_ops_agent/main.py.
entrypoint: agent_change_ops_agent.main:app
framework: langgraph
# Runtime feature flags controlled by agent.yaml, not .env.
# Set memory to true to enable long-term memory; VOYAGE_API_KEY must be present
# in .env when memory is enabled.
features:
    durable_workflow: true
    memory: true
# Tool placement and pass-through secrets. Interrupt tools must stay on the agent.
sandboxes:
    agent:
        secrets: ["*"]
        tools:
            - request_change_approval
    tool:
        secrets: ["*"]
        tools:
            - get_workspace_profile
            - list_services
            - get_active_config
            - list_sample_cases
            - search_change_notes
            - submit_change_draft
            - simulate_change
            - publish_change
            - evaluate_case_tool
            - show_audit_trail
version: 0.1.0
network:
    egress:
        - fqdn: api.anthropic.com
          ports: [443]
