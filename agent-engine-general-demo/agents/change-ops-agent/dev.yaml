# Local services exposed by the app during `agentengine dev`.
# Most host ports are assigned randomly so multiple agents can run at once.
# The playground stays pinned to 3000 because it is the primary browser UI.
# To pin another service, uncomment its block, change the port, and restart
# the local stack.
services:
  playground:
    port: 3000
  # oe:
  #   port: 8000  # Orchestration Engine HTTP API.
  # aer:
  #   port: 8001  # Agent Execution Runtime.
  # tool:
  #   port: 8002  # Tool execution runtime.
  # memory-server:
  #   port: 8081  # Long-term memory service.
  # By default the local stack runs its own MongoDB container and overrides
  # MONGODB_URI. Uncomment and set `local: false` to make the app use the
  # MONGODB_URI from .env (e.g. an existing Atlas cluster) instead, then run a
  # FULL `agentengine dev stop && agentengine dev up` (a plain `dev restart`
  # reuses previously generated artifacts and keeps pointing at the container).
  # mongodb:
  #   local: false
  #   port: 27017  # Local MongoDB host port; ignored when local is false.
